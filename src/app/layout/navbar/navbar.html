<header class="tb no-print">
  <button type="button" class="icon-btn menu" aria-label="Abrir menú" (click)="menu.emit()"><span class="material-symbols-rounded">menu</span></button>
  <div class="tit">
    <h2>{{ titulo() }}</h2>
    <small class="muted fecha">{{ hoy | date: 'EEEE d \'de\' MMMM, y' }}</small>
  </div>
  <span class="spacer"></span>

  <div class="campana">
    <button type="button" class="icon-btn" aria-label="Avisos" [attr.aria-expanded]="avisosAbiertos()" (click)="alternar($event)">
      <span class="material-symbols-rounded">notifications</span>
      @if (avisos().length) { <span class="punto">{{ avisos().length }}</span> }
    </button>
    @if (avisosAbiertos()) {
      <div class="panel card" role="region" aria-label="Avisos">
        <strong class="ptit">Avisos de hoy</strong>
        @for (a of avisos(); track $index) {
          <div class="aviso-item" [class]="a.tono"><span class="material-symbols-rounded">{{ a.icono }}</span><span>{{ a.texto }}</span></div>
        } @empty {
          <p class="vacio muted">No tienes avisos nuevos.</p>
        }
      </div>
    }
  </div>

  <div class="usuario">
    <span class="avatar" aria-hidden="true">{{ iniciales() }}</span>
    <div class="u-txt"><strong>{{ nombre() }}</strong><small class="muted">{{ auth.rol() }}</small></div>
  </div>
</header>
