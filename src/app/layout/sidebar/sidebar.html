<aside class="sb" [class.open]="open()">
  <div class="brand">
    <span class="logo"><span class="material-symbols-rounded fill">agriculture</span></span>
    <div class="brand-txt"><strong>Corabastos</strong><small>Conecta</small></div>
    <button type="button" class="icon-btn cerrar" aria-label="Cerrar menú" (click)="close.emit()"><span class="material-symbols-rounded">close</span></button>
  </div>

  <nav aria-label="Menú principal">
    <span class="seccion">Módulos</span>
    @for (m of auth.modulos(); track m.id) {
      <a class="item" [routerLink]="m.ruta" routerLinkActive="activo" (click)="close.emit()">
        <span class="material-symbols-rounded">{{ m.icono }}</span><span>{{ m.nombre }}</span>
      </a>
    }
  </nav>

  <div class="foot">
    <div class="perfil">
      <span class="material-symbols-rounded">{{ iconoRol() }}</span>
      <div><small>Perfil</small><strong>{{ auth.rol() }}</strong></div>
    </div>
    <button type="button" class="salir" (click)="auth.logout()"><span class="material-symbols-rounded">logout</span>Cerrar sesión</button>
  </div>
</aside>
@if (open()) { <div class="scrim" (click)="close.emit()"></div> }
