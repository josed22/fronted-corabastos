<svg [attr.viewBox]="'0 0 ' + ancho + ' ' + alto" preserveAspectRatio="none" role="img" [attr.aria-label]="etiqueta()">
  <polygon [attr.points]="area()" [attr.fill]="color()" fill-opacity=".12" />
  <polyline [attr.points]="linea()" fill="none" [attr.stroke]="color()" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />
  @for (p of puntos(); track $index) { <circle [attr.cx]="p.x" [attr.cy]="p.y" r="3.5" [attr.fill]="color()" vector-effect="non-scaling-stroke" /> }
</svg>
