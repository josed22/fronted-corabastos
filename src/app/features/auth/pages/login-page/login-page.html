<div class="lg">
  <div class="caja">
    <h1>Corabastos Conecta</h1>
    <h2>Iniciar sesión</h2>

    <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
      <div class="field">
        <label for="rol">Rol</label>
        <select id="rol" class="select" [value]="rolElegido()" (change)="elegirRol($any($event.target).value)">
          @for (r of roles(); track r.id) {
            <option [value]="r.nombre">{{ r.nombre }}</option>
          }
        </select>
      </div>

      <div class="field">
        <label for="correo">Correo</label>
        <input id="correo" class="input" type="email" formControlName="correo" autocomplete="username" />
        @if (form.controls.correo.touched && form.controls.correo.invalid) { <small class="error">Escribe un correo válido</small> }
      </div>

      <div class="field">
        <label for="clave">Contraseña</label>
        <input id="clave" class="input" type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) { <small class="error">Mínimo 6 caracteres</small> }
      </div>

      <button type="submit" class="btn btn-primary">Ingresar</button>
    </form>

    <p class="nota">Versión de demostración: no se conecta a la API.</p>
  </div>
</div>
