<app-page-header title="Mis reservas" subtitle="Productos que has apartado en las bodegas de Corabastos" />

<div class="grid grid-4" style="margin-bottom:20px">
  <app-stat-card icon="pending_actions" tone="naranja" label="Pendientes" [value]="contar('Pendiente')" hint="Esperan confirmación" />
  <app-stat-card icon="check_circle" tone="azul" label="Confirmadas" [value]="contar('Confirmada')" hint="Listas para retirar" />
  <app-stat-card icon="inventory" label="Retiradas" [value]="contar('Retirada')" />
  <app-stat-card icon="cancel" tone="rojo" label="Canceladas" [value]="contar('Cancelada')" />
</div>

<app-data-table [columns]="columnas" [rows]="mias()" [actions]="acciones" placeholder="Buscar por código, bodega o estado…" emptyText="Aún no tienes reservas" (action)="alAccion($event)" />

<app-reserva-detalle [reserva]="detalle()" (closed)="detalle.set(null)" />
<app-confirm-dialog [open]="cancelando() !== null" title="Cancelar reserva" confirmLabel="Sí, cancelar" [danger]="true"
  [message]="'¿Cancelar la reserva ' + (cancelando()?.['codigo'] ?? '') + '? La bodega dejará de apartar tus productos.'"
  (confirmed)="confirmarCancelar()" (cancelled)="cancelando.set(null)" />
